<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Idiomi | Helping the world learn languages</title>
    <meta name="description" content="Idiomi helps the world learn languages.">
    <link rel="canonical" href="https://idiomi.com/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7efe5;
        color: #20201d;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f7efe5;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2rem, 7vw, 4.5rem);
        border: 1px solid #d9c9b8;
        border-radius: 1.5rem;
        background: #fffdf9;
        box-shadow: 0 1.5rem 4rem rgba(64, 45, 30, 0.08);
      }

      h1, h2, p { margin-top: 0; }

      h1 {
        margin-bottom: 1rem;
        color: #164d53;
        font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
        font-size: clamp(3rem, 12vw, 6rem);
        font-weight: 700;
        letter-spacing: -0.055em;
        line-height: 0.95;
      }

      .message {
        max-width: 27rem;
        margin-bottom: clamp(3.5rem, 10vw, 6rem);
        color: #4d4842;
        font-size: clamp(1.2rem, 4vw, 1.65rem);
        line-height: 1.5;
      }

      h2 {
        margin-bottom: 0.65rem;
        color: #20201d;
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      a {
        color: #0a5b57;
        font-size: clamp(1.05rem, 3vw, 1.2rem);
        font-weight: 650;
        text-decoration-thickness: 0.09em;
        text-underline-offset: 0.22em;
      }

      a:hover { color: #8c2f25; }

      a:focus-visible {
        border-radius: 0.2rem;
        outline: 0.2rem solid #b76807;
        outline-offset: 0.25rem;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Idiomi</h1>
      <p class="message">Helping the world learn languages.</p>
      <h2>Contact</h2>
      <a href="mailto:hello@idiomi.com">hello@idiomi.com</a>
    </main>
  </body>
</html>
